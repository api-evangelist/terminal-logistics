aid: terminal-logistics
name: Terminal Logistics
description: >-
  Terminal Industries (Terminal Logistics) is the company behind the Terminal Yard
  Operating System (YOS), an AI-native, fully-integrated platform for yard operations
  across logistics and supply chain. It unifies gate management, carrier risk
  assessment and driver ID, dispatch and spotter orchestration, yard visibility,
  load verification, carrier appointments, and end-to-end yard security from the gate
  to the dock, using computer vision and agentic AI. It serves third-party logistics,
  retail and grocery, consumer packaged goods, refrigerated warehousing, contract
  carriers, manufacturing facilities, and drop lots. Backed by 8vc. No public
  developer API is currently published; this profile captures the company's public
  web, security, and status surface.
